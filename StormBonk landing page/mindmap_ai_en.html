<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; font-family: Arial, sans-serif; font-size: 11px; }
svg { width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles -->
  <defs>
    <style>
      .root { fill: #c8d4f0; stroke: #7090d0; stroke-width: 1.5; rx: 6; }
      .cat  { fill: #d4eaf5; stroke: #80b8d8; stroke-width: 1; }
      .leaf { fill: #b8f0d8; stroke: #50b880; stroke-width: 1; }
      .line { stroke: #90b0d0; stroke-width: 1.2; fill: none; }
      text  { font-family: Arial, sans-serif; font-size: 10px; fill: #333; }
      .root-t { font-size: 12px; font-weight: bold; fill: #224; }
      .cat-t  { font-size: 10px; font-weight: bold; fill: #224; }
      .leaf-t { font-size: 9px; fill: #336; }
    </style>
  </defs>

  <!-- ROOT -->
  <rect x="20" y="310" width="130" height="30" rx="6" class="root"/>
  <text x="85" y="329" text-anchor="middle" class="root-t">StormBonk AI</text>

  <!-- Lines from root -->
  <line x1="150" y1="325" x2="200" y2="120" class="line"/>
  <line x1="150" y1="325" x2="200" y2="290" class="line"/>
  <line x1="150" y1="325" x2="200" y2="450" class="line"/>
  <line x1="150" y1="325" x2="200" y2="590" class="line"/>

  <!-- ── CAT 1: Perception & Sensors ── -->
  <rect x="200" y="100" width="155" height="28" rx="5" class="cat"/>
  <text x="277" y="118" text-anchor="middle" class="cat-t">Perception &amp; Sensors</text>

  <!-- Vision -->
  <line x1="355" y1="114" x2="400" y2="60" class="line"/>
  <rect x="400" y="46" width="130" height="24" rx="4" class="cat"/>
  <text x="465" y="62" text-anchor="middle" class="cat-t">Vision</text>
  <line x1="530" y1="58" x2="570" y2="35" class="line"/>
  <rect x="570" y="22" width="145" height="20" rx="3" class="leaf"/>
  <text x="642" y="36" text-anchor="middle" class="leaf-t">Range: 15 units</text>
  <line x1="530" y1="58" x2="570" y2="55" class="line"/>
  <rect x="570" y="44" width="145" height="20" rx="3" class="leaf"/>
  <text x="642" y="58" text-anchor="middle" class="leaf-t">Raycast usage</text>
  <line x1="530" y1="58" x2="570" y2="75" class="line"/>
  <rect x="570" y="66" width="145" height="20" rx="3" class="leaf"/>
  <text x="642" y="80" text-anchor="middle" class="leaf-t">Wall-free line of sight</text>

  <!-- Proximity -->
  <line x1="355" y1="114" x2="400" y2="140" class="line"/>
  <rect x="400" y="126" width="130" height="24" rx="4" class="cat"/>
  <text x="465" y="142" text-anchor="middle" class="cat-t">Proximity</text>
  <line x1="530" y1="138" x2="570" y2="118" class="line"/>
  <rect x="570" y="106" width="145" height="20" rx="3" class="leaf"/>
  <text x="642" y="120" text-anchor="middle" class="leaf-t">Range: 10 units</text>
  <line x1="530" y1="138" x2="570" y2="138" class="line"/>
  <rect x="570" y="127" width="145" height="20" rx="3" class="leaf"/>
  <text x="642" y="141" text-anchor="middle" class="leaf-t">Simple distance check</text>
  <line x1="530" y1="138" x2="570" y2="158" class="line"/>
  <rect x="570" y="148" width="145" height="20" rx="3" class="leaf"/>
  <text x="642" y="162" text-anchor="middle" class="leaf-t">Ignores obstacles</text>

  <!-- ── CAT 2: Finite State Machine ── -->
  <rect x="200" y="272" width="155" height="28" rx="5" class="cat"/>
  <text x="277" y="290" text-anchor="middle" class="cat-t">Finite State Machine</text>
  <line x1="355" y1="286" x2="400" y2="220" class="line"/>
  <rect x="400" y="208" width="120" height="20" rx="3" class="leaf"/>
  <text x="460" y="222" text-anchor="middle" class="leaf-t">Patrol</text>
  <line x1="355" y1="286" x2="400" y2="242" class="line"/>
  <rect x="400" y="230" width="120" height="20" rx="3" class="leaf"/>
  <text x="460" y="244" text-anchor="middle" class="leaf-t">Pursue</text>
  <line x1="355" y1="286" x2="400" y2="264" class="line"/>
  <rect x="400" y="252" width="120" height="20" rx="3" class="leaf"/>
  <text x="460" y="266" text-anchor="middle" class="leaf-t">Attack</text>
  <line x1="355" y1="286" x2="400" y2="286" class="line"/>
  <rect x="400" y="274" width="120" height="20" rx="3" class="leaf"/>
  <text x="460" y="288" text-anchor="middle" class="leaf-t">Retreat</text>
  <line x1="355" y1="286" x2="400" y2="308" class="line"/>
  <rect x="400" y="296" width="120" height="20" rx="3" class="leaf"/>
  <text x="460" y="310" text-anchor="middle" class="leaf-t">Stunned</text>

  <!-- ── CAT 3: Steering Behaviors ── -->
  <rect x="200" y="432" width="155" height="28" rx="5" class="cat"/>
  <text x="277" y="450" text-anchor="middle" class="cat-t">Steering Behaviors</text>
  <line x1="355" y1="446" x2="400" y2="390" class="line"/>
  <rect x="400" y="376" width="130" height="24" rx="4" class="cat"/>
  <text x="465" y="392" text-anchor="middle" class="cat-t">Seek</text>
  <line x1="530" y1="388" x2="570" y2="388" class="line"/>
  <rect x="570" y="377" width="155" height="20" rx="3" class="leaf"/>
  <text x="647" y="391" text-anchor="middle" class="leaf-t">Movement toward player</text>
  <line x1="355" y1="446" x2="400" y2="430" class="line"/>
  <rect x="400" y="416" width="130" height="24" rx="4" class="cat"/>
  <text x="465" y="432" text-anchor="middle" class="cat-t">Flee</text>
  <line x1="530" y1="428" x2="570" y2="428" class="line"/>
  <rect x="570" y="417" width="155" height="20" rx="3" class="leaf"/>
  <text x="647" y="431" text-anchor="middle" class="leaf-t">Movement away from player</text>
  <line x1="355" y1="446" x2="400" y2="468" class="line"/>
  <rect x="400" y="456" width="130" height="24" rx="4" class="cat"/>
  <text x="465" y="472" text-anchor="middle" class="cat-t">Wander</text>
  <line x1="530" y1="468" x2="570" y2="468" class="line"/>
  <rect x="570" y="457" width="155" height="20" rx="3" class="leaf"/>
  <text x="647" y="471" text-anchor="middle" class="leaf-t">Random NavMesh points</text>

  <!-- ── CAT 4: Enemy Archetypes ── -->
  <rect x="200" y="572" width="155" height="28" rx="5" class="cat"/>
  <text x="277" y="590" text-anchor="middle" class="cat-t">Enemy Archetypes</text>
  <!-- Melee Hunter -->
  <line x1="355" y1="586" x2="400" y2="530" class="line"/>
  <rect x="400" y="516" width="140" height="24" rx="4" class="cat"/>
  <text x="470" y="532" text-anchor="middle" class="cat-t">Melee Hunter</text>
  <line x1="540" y1="528" x2="570" y2="512" class="line"/>
  <rect x="570" y="500" width="155" height="20" rx="3" class="leaf"/>
  <text x="647" y="514" text-anchor="middle" class="leaf-t">Patrols arena</text>
  <line x1="540" y1="528" x2="570" y2="532" class="line"/>
  <rect x="570" y="521" width="155" height="20" rx="3" class="leaf"/>
  <text x="647" y="535" text-anchor="middle" class="leaf-t">Seeks on sight</text>
  <line x1="540" y1="528" x2="570" y2="552" class="line"/>
  <rect x="570" y="542" width="155" height="20" rx="3" class="leaf"/>
  <text x="647" y="556" text-anchor="middle" class="leaf-t">Attack with warning anim.</text>
  <!-- Ranged Shooter -->
  <line x1="355" y1="586" x2="400" y2="586" class="line"/>
  <rect x="400" y="572" width="140" height="24" rx="4" class="cat"/>
  <text x="470" y="588" text-anchor="middle" class="cat-t">Ranged Shooter</text>
  <line x1="540" y1="584" x2="570" y2="572" class="line"/>
  <rect x="570" y="562" width="155" height="20" rx="3" class="leaf"/>
  <text x="647" y="576" text-anchor="middle" class="leaf-t">Seeks if dist &gt; 10u</text>
  <line x1="540" y1="584" x2="570" y2="592" class="line"/>
  <rect x="570" y="582" width="155" height="20" rx="3" class="leaf"/>
  <text x="647" y="596" text-anchor="middle" class="leaf-t">Attacks between 7u–10u</text>
  <line x1="540" y1="584" x2="570" y2="612" class="line"/>
  <rect x="570" y="602" width="155" height="20" rx="3" class="leaf"/>
  <text x="647" y="616" text-anchor="middle" class="leaf-t">Flees if dist &lt; 7u</text>
  <!-- Charger -->
  <line x1="355" y1="586" x2="400" y2="642" class="line"/>
  <rect x="400" y="628" width="140" height="24" rx="4" class="cat"/>
  <text x="470" y="644" text-anchor="middle" class="cat-t">Charger</text>
  <line x1="540" y1="640" x2="570" y2="626" class="line"/>
  <rect x="570" y="622" width="155" height="20" rx="3" class="leaf"/>
  <text x="647" y="636" text-anchor="middle" class="leaf-t">Locks player position</text>
  <line x1="540" y1="640" x2="570" y2="646" class="line"/>
  <rect x="570" y="642" width="155" height="20" rx="3" class="leaf"/>
  <text x="647" y="656" text-anchor="middle" class="leaf-t">Extreme speed burst</text>
  <line x1="540" y1="640" x2="570" y2="666" class="line"/>
  <rect x="570" y="662" width="155" height="20" rx="3" class="leaf"/>
  <text x="647" y="676" text-anchor="middle" class="leaf-t">Stunned after impact</text>
</svg>
</body>
</html>
