<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; font-family: Arial, sans-serif; font-size: 11px; }
svg { width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 900 860" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .root { fill: #c8d4f0; stroke: #7090d0; stroke-width: 1.5; }
      .cat  { fill: #d4eaf5; stroke: #80b8d8; stroke-width: 1; }
      .leaf { fill: #b8f0d8; stroke: #50b880; stroke-width: 1; }
      .line { stroke: #90b0d0; stroke-width: 1.2; fill: none; }
      text  { font-family: Arial, sans-serif; font-size: 10px; fill: #333; }
      .root-t { font-size: 12px; font-weight: bold; fill: #224; }
      .cat-t  { font-size: 10px; font-weight: bold; fill: #224; }
      .leaf-t { font-size: 9px; fill: #336; }
    </style>
  </defs>

  <!-- ROOT -->
  <rect x="20" y="400" width="110" height="30" rx="6" class="root"/>
  <text x="75" y="419" text-anchor="middle" class="root-t">StormBonk</text>

  <!-- Lines from root to main categories -->
  <line x1="130" y1="415" x2="180" y2="80"  class="line"/>
  <line x1="130" y1="415" x2="180" y2="210" class="line"/>
  <line x1="130" y1="415" x2="180" y2="360" class="line"/>
  <line x1="130" y1="415" x2="180" y2="510" class="line"/>
  <line x1="130" y1="415" x2="180" y2="640" class="line"/>
  <line x1="130" y1="415" x2="180" y2="770" class="line"/>

  <!-- ── 1. Overview ── -->
  <rect x="180" y="66" width="120" height="26" rx="5" class="cat"/>
  <text x="240" y="83" text-anchor="middle" class="cat-t">Overview</text>
  <line x1="300" y1="79" x2="340" y2="44" class="line"/><rect x="340" y="33" width="175" height="20" rx="3" class="leaf"/><text x="427" y="47" text-anchor="middle" class="leaf-t">Genre: Action Roguelite 2D</text>
  <line x1="300" y1="79" x2="340" y2="66" class="line"/><rect x="340" y="55" width="175" height="20" rx="3" class="leaf"/><text x="427" y="69" text-anchor="middle" class="leaf-t">Platform: PC (Unity)</text>
  <line x1="300" y1="79" x2="340" y2="88" class="line"/><rect x="340" y="77" width="175" height="20" rx="3" class="leaf"/><text x="427" y="91" text-anchor="middle" class="leaf-t">Aesthetic: Cyber-Fantasy</text>
  <line x1="300" y1="79" x2="340" y2="110" class="line"/><rect x="340" y="99" width="175" height="20" rx="3" class="leaf"/><text x="427" y="113" text-anchor="middle" class="leaf-t">Team: Group 07 Games</text>

  <!-- ── 2. Gameplay ── -->
  <rect x="180" y="196" width="120" height="26" rx="5" class="cat"/>
  <text x="240" y="213" text-anchor="middle" class="cat-t">Gameplay</text>
  <!-- Core Loop -->
  <line x1="300" y1="209" x2="340" y2="155" class="line"/>
  <rect x="340" y="141" width="120" height="24" rx="4" class="cat"/>
  <text x="400" y="157" text-anchor="middle" class="cat-t">Core Loop</text>
  <line x1="460" y1="153" x2="500" y2="133" class="line"/><rect x="500" y="122" width="165" height="20" rx="3" class="leaf"/><text x="582" y="136" text-anchor="middle" class="leaf-t">Combat and positioning</text>
  <line x1="460" y1="153" x2="500" y2="153" class="line"/><rect x="500" y="142" width="165" height="20" rx="3" class="leaf"/><text x="582" y="156" text-anchor="middle" class="leaf-t">Collect XP and Gold</text>
  <line x1="460" y1="153" x2="500" y2="173" class="line"/><rect x="500" y="162" width="165" height="20" rx="3" class="leaf"/><text x="582" y="176" text-anchor="middle" class="leaf-t">Level up (Tones)</text>
  <line x1="460" y1="153" x2="500" y2="193" class="line"/><rect x="500" y="182" width="165" height="20" rx="3" class="leaf"/><text x="582" y="196" text-anchor="middle" class="leaf-t">Overcome obstacles &amp; bosses</text>
  <!-- Controls -->
  <line x1="300" y1="209" x2="340" y2="230" class="line"/>
  <rect x="340" y="216" width="120" height="24" rx="4" class="cat"/>
  <text x="400" y="232" text-anchor="middle" class="cat-t">Controls</text>
  <line x1="460" y1="228" x2="500" y2="212" class="line"/><rect x="500" y="201" width="165" height="20" rx="3" class="leaf"/><text x="582" y="215" text-anchor="middle" class="leaf-t">WASD: Movement</text>
  <line x1="460" y1="228" x2="500" y2="232" class="line"/><rect x="500" y="221" width="165" height="20" rx="3" class="leaf"/><text x="582" y="235" text-anchor="middle" class="leaf-t">Space: Dash</text>
  <line x1="460" y1="228" x2="500" y2="252" class="line"/><rect x="500" y="241" width="165" height="20" rx="3" class="leaf"/><text x="582" y="255" text-anchor="middle" class="leaf-t">Shift: Sprint</text>
  <line x1="460" y1="228" x2="500" y2="272" class="line"/><rect x="500" y="261" width="165" height="20" rx="3" class="leaf"/><text x="582" y="275" text-anchor="middle" class="leaf-t">E: Interact</text>

  <!-- ── 3. AI & Enemies ── -->
  <rect x="180" y="346" width="120" height="26" rx="5" class="cat"/>
  <text x="240" y="363" text-anchor="middle" class="cat-t">AI &amp; Enemies</text>
  <!-- AI System -->
  <line x1="300" y1="359" x2="340" y2="310" class="line"/>
  <rect x="340" y="296" width="120" height="24" rx="4" class="cat"/>
  <text x="400" y="312" text-anchor="middle" class="cat-t">AI System</text>
  <line x1="460" y1="308" x2="500" y2="296" class="line"/><rect x="500" y="285" width="165" height="20" rx="3" class="leaf"/><text x="582" y="299" text-anchor="middle" class="leaf-t">Finite State Machine (FSM)</text>
  <line x1="460" y1="308" x2="500" y2="316" class="line"/><rect x="500" y="305" width="165" height="20" rx="3" class="leaf"/><text x="582" y="319" text-anchor="middle" class="leaf-t">Perception: Vision &amp; Proximity</text>
  <line x1="460" y1="308" x2="500" y2="336" class="line"/><rect x="500" y="325" width="165" height="20" rx="3" class="leaf"/><text x="582" y="339" text-anchor="middle" class="leaf-t">Steering Behaviors</text>
  <!-- Enemy Types -->
  <line x1="300" y1="359" x2="340" y2="385" class="line"/>
  <rect x="340" y="371" width="120" height="24" rx="4" class="cat"/>
  <text x="400" y="387" text-anchor="middle" class="cat-t">Enemy Types</text>
  <line x1="460" y1="383" x2="500" y2="367" class="line"/><rect x="500" y="356" width="165" height="20" rx="3" class="leaf"/><text x="582" y="370" text-anchor="middle" class="leaf-t">Melee Hunter: Patrol &amp; charge</text>
  <line x1="460" y1="383" x2="500" y2="387" class="line"/><rect x="500" y="376" width="165" height="20" rx="3" class="leaf"/><text x="582" y="390" text-anchor="middle" class="leaf-t">Ranged Shooter: Keeps distance</text>
  <line x1="460" y1="383" x2="500" y2="407" class="line"/><rect x="500" y="396" width="165" height="20" rx="3" class="leaf"/><text x="582" y="410" text-anchor="middle" class="leaf-t">Charger: Ambush &amp; stun</text>

  <!-- ── 4. Progression ── -->
  <rect x="180" y="496" width="120" height="26" rx="5" class="cat"/>
  <text x="240" y="513" text-anchor="middle" class="cat-t">Progression</text>
  <line x1="300" y1="509" x2="340" y2="470" class="line"/>
  <rect x="340" y="456" width="120" height="24" rx="4" class="cat"/>
  <text x="400" y="472" text-anchor="middle" class="cat-t">Tone System</text>
  <line x1="460" y1="468" x2="500" y2="452" class="line"/><rect x="500" y="441" width="165" height="20" rx="3" class="leaf"/><text x="582" y="455" text-anchor="middle" class="leaf-t">Fire: Stacking burn damage</text>
  <line x1="460" y1="468" x2="500" y2="472" class="line"/><rect x="500" y="461" width="165" height="20" rx="3" class="leaf"/><text x="582" y="475" text-anchor="middle" class="leaf-t">Ice: Control &amp; preservation</text>
  <line x1="460" y1="468" x2="500" y2="492" class="line"/><rect x="500" y="481" width="165" height="20" rx="3" class="leaf"/><text x="582" y="495" text-anchor="middle" class="leaf-t">Lightning: Speed &amp; chaining</text>
  <line x1="460" y1="468" x2="500" y2="512" class="line"/><rect x="500" y="501" width="165" height="20" rx="3" class="leaf"/><text x="582" y="515" text-anchor="middle" class="leaf-t">Melee: Extreme close combat</text>
  <line x1="300" y1="509" x2="340" y2="540" class="line"/>
  <rect x="340" y="526" width="165" height="20" rx="3" class="leaf"/>
  <text x="422" y="540" text-anchor="middle" class="leaf-t">Meta-progression: The Core upgrades</text>
  <line x1="300" y1="509" x2="340" y2="562" class="line"/>
  <rect x="340" y="551" width="165" height="20" rx="3" class="leaf"/>
  <text x="422" y="565" text-anchor="middle" class="leaf-t">12 levels × 5 waves each</text>

  <!-- ── 5. Narrative ── -->
  <rect x="180" y="626" width="120" height="26" rx="5" class="cat"/>
  <text x="240" y="643" text-anchor="middle" class="cat-t">Narrative</text>
  <line x1="300" y1="639" x2="340" y2="611" class="line"/><rect x="340" y="600" width="175" height="20" rx="3" class="leaf"/><text x="427" y="614" text-anchor="middle" class="leaf-t">Context: Digital Apocalypse</text>
  <line x1="300" y1="639" x2="340" y2="633" class="line"/><rect x="340" y="622" width="175" height="20" rx="3" class="leaf"/><text x="427" y="636" text-anchor="middle" class="leaf-t">Protagonist: Storm Breaker</text>
  <line x1="300" y1="639" x2="340" y2="655" class="line"/><rect x="340" y="644" width="175" height="20" rx="3" class="leaf"/><text x="427" y="658" text-anchor="middle" class="leaf-t">Scenarios: Academy, Caverns, Waters</text>

  <!-- ── 6. UI/UX ── -->
  <rect x="180" y="756" width="120" height="26" rx="5" class="cat"/>
  <text x="240" y="773" text-anchor="middle" class="cat-t">UI / UX</text>
  <line x1="300" y1="769" x2="340" y2="744" class="line"/><rect x="340" y="733" width="175" height="20" rx="3" class="leaf"/><text x="427" y="747" text-anchor="middle" class="leaf-t">HUD: HP bar, XP, cooldown, gold</text>
  <line x1="300" y1="769" x2="340" y2="766" class="line"/><rect x="340" y="755" width="175" height="20" rx="3" class="leaf"/><text x="427" y="769" text-anchor="middle" class="leaf-t">Feedback: Damage numbers, red zones</text>
  <line x1="300" y1="769" x2="340" y2="788" class="line"/><rect x="340" y="777" width="175" height="20" rx="3" class="leaf"/><text x="427" y="791" text-anchor="middle" class="leaf-t">Style: RPG parchment with glitch</text>
</svg>
</body>
</html>
